# Render blueprint for the Farm Case API.
# No database. The service is a Python process: NASA POWER, GIBS links,
# and the crop ranker. Demo-farm fixtures ship in the repo.
# The 0.5 degree POWER cache lives on the instance disk and disappears
# on the next deploy, which is fine. A missed cache calls POWER again.

services:
  - type: web
    name: farm-case-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Comma-separated extra origins. The code also allows localhost,
      # html-classic.itch.zone, html.itch.zone, any *.itch.io page, and
      # any *.vercel.app site. Replace * with the real site later.
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
